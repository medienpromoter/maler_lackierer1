# docker-compose.yml – statische Auslieferung der Website über nginx.
# Start:   docker compose up -d
# Aufruf:  http://localhost:8080
#
# Hinweis: Vor dem Build sollten die Leistungsseiten generiert sein:
#   node scripts/generate-leistungen.js

services:
  web:
    image: nginx:1.27-alpine
    container_name: maler-website
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Statische Inhalte (read-only ins Image gemountet)
      - ./:/usr/share/nginx/html:ro
      # Eigene nginx-Konfiguration
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

# nginx-Konfiguration für die statische Website Malerbetrieb Wagner
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Saubere Fehlerseiten
    error_page 404 /index.html;

    # Standard: Datei suchen, sonst 404
    location / {
        try_files $uri $uri/ =404;
    }

    # .html auch ohne Endung erreichbar (z. B. /kontakt -> /kontakt.html)
    location ~ ^/([^.]+)$ {
        try_files /$1.html $uri $uri/ =404;
    }

    # Caching statischer Assets
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # content.js darf nicht zu lange gecacht werden (Datenquelle)
    location = /content/content.js {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Sicherheits-Header
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;
}
